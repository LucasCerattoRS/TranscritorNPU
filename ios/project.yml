# Projeto Xcode gerado pelo XcodeGen (`xcodegen generate`), no GitHub Actions: não há Mac na rotina.
name: Transcritor
options:
  bundleIdPrefix: io.github.lucascerattors
  deploymentTarget:
    iOS: "17.0"
packages:
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift
    exactVersion: 1.1.1
  Nucleo:
    path: Nucleo
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Transcritor:
    type: application
    platform: iOS
    sources: [Transcritor]
    dependencies:
      - package: ArgmaxOSS
        product: WhisperKit
      - package: Nucleo
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.lucascerattors.transcritor
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Transcritor/Info.plist
      properties:
        CFBundleDisplayName: Transcritor
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Vídeos e transcrições ficam visíveis no app Arquivos.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: io.github.lucascerattors.transcritor
            CFBundleURLSchemes: [transcritor]
